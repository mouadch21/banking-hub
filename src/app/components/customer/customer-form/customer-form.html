 
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg">
        <div class="card-header bg-primary text-white py-4">
          <h3 class="mb-0">
            <i class="bi me-2" [class.bi-person-plus]="customerId === null" [class.bi-person-gear]="customerId !== null"></i>
            {{ customerId === null ? 'Créer un nouveau client' : 'Modifier le client' }}
          </h3>
        </div>
        <div class="card-body p-5">
          <div class="alert alert-danger" role="alert" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <!-- Prénom et Nom -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="firstName" class="form-label fw-bold">Prénom *</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="firstName"
                  formControlName="firstName"
                  [class.is-invalid]="submitted && f['firstName'].errors"
                  placeholder="Jean"
                />
                <div class="invalid-feedback d-block" *ngIf="submitted && f['firstName'].errors">
                  <span *ngIf="f['firstName'].errors['required']">Le prénom est requis</span>
                  <span *ngIf="f['firstName'].errors['minlength']">Minimum 2 caractères</span>
                </div>
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label fw-bold">Nom *</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="lastName"
                  formControlName="lastName"
                  [class.is-invalid]="submitted && f['lastName'].errors"
                  placeholder="Dupont"
                />
                <div class="invalid-feedback d-block" *ngIf="submitted && f['lastName'].errors">
                  <span *ngIf="f['lastName'].errors['required']">Le nom est requis</span>
                  <span *ngIf="f['lastName'].errors['minlength']">Minimum 2 caractères</span>
                </div>
              </div>
            </div>
 
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label fw-bold">Email *</label>
              <input
                type="email"
                class="form-control form-control-lg"
                id="email"
                formControlName="email"
                [class.is-invalid]="submitted && f['email'].errors"
                placeholder="jean.dupont@example.com"
              />
              <div class="invalid-feedback d-block" *ngIf="submitted && f['email'].errors">
                <span *ngIf="f['email'].errors['required']">L'email est requis</span>
                <span *ngIf="f['email'].errors['email']">Email invalide</span>
              </div>
            </div>
 
            <!-- Téléphone -->
            <div class="mb-3">
              <label for="phone" class="form-label fw-bold">Téléphone</label>
              <input
                type="tel"
                class="form-control form-control-lg"
                id="phone"
                formControlName="phone"
                placeholder="0612345678"
              />
            </div>
 
            <!-- Adresse -->
            <div class="mb-3">
              <label for="address" class="form-label fw-bold">Adresse</label>
              <input
                type="text"
                class="form-control form-control-lg"
                id="address"
                formControlName="address"
                placeholder="123 rue de la Paix"
              />
            </div>
 
            <!-- Ville et Pays -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="city" class="form-label fw-bold">Ville</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="city"
                  formControlName="city"
                  placeholder="Paris"
                />
              </div>
              <div class="col-md-6">
                <label for="country" class="form-label fw-bold">Pays</label>
                <input
                  type="text"
                  class="form-control form-control-lg"
                  id="country"
                  formControlName="country"
                  placeholder="France"
                />
              </div>
            </div>
 
            <!-- Boutons -->
            <div class="d-grid gap-2 d-md-flex">
              <button
                type="submit"
                class="btn btn-primary btn-lg"
                [disabled]="loading"
              >
                <span *ngIf="!loading">
                  <i class="bi bi-check-circle me-2"></i>
                  {{ customerId === null ? 'Créer le client' : 'Enregistrer les modifications' }}
                </span>
                <span *ngIf="loading">
                  <i class="spinner-border spinner-border-sm me-2"></i> En cours...
                </span>
              </button>
              <button
                type="button"
                class="btn btn-light btn-lg"
                (click)="resetForm()"
                [disabled]="loading"
              >
                <i class="bi bi-arrow-clockwise me-2"></i>
                {{ customerId === null ? 'Réinitialiser' : 'Annuler les modifications' }}
              </button>
              <a routerLink="/customers" class="btn btn-secondary btn-lg">
                <i class="bi bi-arrow-left me-2"></i> Retour
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
